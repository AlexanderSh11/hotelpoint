{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        HotelPoint
      {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    {% block extra_css %}
    {% endblock %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <div class="container header-container">
          <h1 class="logo"><a href="{% url 'room_list' %}">HotelPoint</a></h1>
          <nav class="nav">
            <a href="{% url 'room_list' %}">Номера</a>
            <a href="{% url 'booking_list' %}">Бронирования</a>
            <a href="{% url 'client_list' %}">Гости</a>
          </nav>
        </div>
      </header>

      <main class="container">
        {% block content %}
        {% endblock %}
      </main>

      <footer>
        <div class="container footer-container">
          <p>&copy; 2025 HotelPoint. Все права защищены.</p>
          <p>Телефон: +7 (999) 123-45-67 | Email: info@hotelpoint.ru</p>
        </div>
      </footer>
    </div>
  </body>
</html>
